services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-discovery}
      POSTGRES_USER:     ${DB_USERNAME:-discovery}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-discovery}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV:   production
      APP_DEBUG: "false"
      APP_KEY:   ${APP_KEY}
      APP_URL:   ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_DATABASE:   ${DB_DATABASE:-discovery}
      DB_USERNAME:   ${DB_USERNAME:-discovery}
      DB_PASSWORD:   ${DB_PASSWORD}
      REDIS_CLIENT:  predis
      REDIS_HOST:    redis
      REDIS_PORT:    6379
      PARSER_URL:    ${PARSER_URL:-http://host.docker.internal:8000}
      PARSER_API_KEY: ${PARSER_API_KEY:-}
      QUEUE_CONNECTION: redis
      CACHE_STORE:      redis
      SESSION_DRIVER:   redis
      LOG_CHANNEL:      stderr
    volumes:
      - backend_storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV:   production
      APP_DEBUG: "false"
      APP_KEY:   ${APP_KEY}
      APP_URL:   ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_DATABASE:   ${DB_DATABASE:-discovery}
      DB_USERNAME:   ${DB_USERNAME:-discovery}
      DB_PASSWORD:   ${DB_PASSWORD}
      REDIS_CLIENT:  predis
      REDIS_HOST:    redis
      REDIS_PORT:    6379
      PARSER_URL:    ${PARSER_URL:-http://host.docker.internal:8000}
      PARSER_API_KEY: ${PARSER_API_KEY:-}
      QUEUE_CONNECTION: redis
      CACHE_STORE:      redis
      SESSION_DRIVER:   redis
      LOG_CHANNEL:      stderr
    volumes:
      - backend_storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/bin/sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV:   production
      APP_DEBUG: "false"
      APP_KEY:   ${APP_KEY}
      APP_URL:   ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_DATABASE:   ${DB_DATABASE:-discovery}
      DB_USERNAME:   ${DB_USERNAME:-discovery}
      DB_PASSWORD:   ${DB_PASSWORD}
      REDIS_CLIENT:  predis
      REDIS_HOST:    redis
      REDIS_PORT:    6379
      PARSER_URL:    ${PARSER_URL:-http://host.docker.internal:8000}
      PARSER_API_KEY: ${PARSER_API_KEY:-}
      QUEUE_CONNECTION: redis
      CACHE_STORE:      redis
      SESSION_DRIVER:   redis
      LOG_CHANNEL:      stderr
    volumes:
      - backend_storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PUBLIC_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_storage:
