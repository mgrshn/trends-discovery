services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-discovery}
      POSTGRES_USER:     ${DB_USERNAME:-discovery}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-discovery}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV:        production
      APP_DEBUG:      "false"
      APP_KEY:        ${APP_KEY}
      APP_URL:        ${APP_URL}
      DB_CONNECTION:  pgsql
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_DATABASE:    ${DB_DATABASE:-discovery}
      DB_USERNAME:    ${DB_USERNAME:-discovery}
      DB_PASSWORD:    ${DB_PASSWORD}
      REDIS_CLIENT:   predis
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      PARSER_URL:     ${PARSER_URL:-http://parser:8000}
      PARSER_API_KEY: ${PARSER_API_KEY}
      QUEUE_CONNECTION: redis
      CACHE_STORE:      redis
      SESSION_DRIVER:   redis
      LOG_CHANNEL:      stderr
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - default
      - shared

  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV:        production
      APP_DEBUG:      "false"
      APP_KEY:        ${APP_KEY}
      APP_URL:        ${APP_URL}
      DB_CONNECTION:  pgsql
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_DATABASE:    ${DB_DATABASE:-discovery}
      DB_USERNAME:    ${DB_USERNAME:-discovery}
      DB_PASSWORD:    ${DB_PASSWORD}
      REDIS_CLIENT:   predis
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      PARSER_URL:     ${PARSER_URL:-http://parser:8000}
      PARSER_API_KEY: ${PARSER_API_KEY}
      QUEUE_CONNECTION: redis
      CACHE_STORE:      redis
      SESSION_DRIVER:   redis
      LOG_CHANNEL:      stderr
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - default
      - shared

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV:        production
      APP_DEBUG:      "false"
      APP_KEY:        ${APP_KEY}
      APP_URL:        ${APP_URL}
      DB_CONNECTION:  pgsql
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_DATABASE:    ${DB_DATABASE:-discovery}
      DB_USERNAME:    ${DB_USERNAME:-discovery}
      DB_PASSWORD:    ${DB_PASSWORD}
      REDIS_CLIENT:   predis
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      PARSER_URL:     ${PARSER_URL:-http://parser:8000}
      PARSER_API_KEY: ${PARSER_API_KEY}
      QUEUE_CONNECTION: redis
      CACHE_STORE:      redis
      SESSION_DRIVER:   redis
      LOG_CHANNEL:      stderr
    volumes:
      - backend_storage:/var/www/html/storage

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - backend

networks:
  default:
    driver: bridge
  shared:
    external: true

volumes:
  postgres_data:
  redis_data:
  backend_storage:
  caddy_data:
  caddy_config:
